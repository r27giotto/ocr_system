app:
  log_dir: "./logs"
  csv_output: "./logs/results.csv"
  save_csv: true

target:
  numbers: ["12", "19", "20", "25", "37", "41", "43"]
  valid_min: 1
  valid_max: 48

models:
  # 下拉框里的候选清单。前两个已离线可用（在 models/official_models/ 里）。
  # ⚠️ PP-OCRv5_server_rec **本地没有**，选中它会联网下载 —— 离线环境请勿选
  #    （用户 m03646：「最好是离线」）。要离线用它，先把该模型目录下载进
  #    models/official_models/ 再说。
  rec_options:
    - "PP-OCRv6_small_rec"
    - "PP-OCRv6_medium_rec"
    - "PP-OCRv5_server_rec"
  ori_options:
    - "PP-LCNet_x1_0_textline_ori"
  default_rec: "PP-OCRv6_small_rec"
  default_ori: "PP-LCNet_x1_0_textline_ori"

recognizer:
  # 单个候选进入聚合池的门槛（只做准入，不做择优）
  conf_threshold: 0.5
  # 【已废弃】旧版 0° 早退阈值。新版按「数字聚合分」选结果，必须跑完所有
  # 角度才能投票，早退会丢票；这个值已不再被读取，留着只为兼容旧配置。
  early_exit_conf: 0.99
  # 打印每个数字的 聚合分/最高分/票数。调优阶段建议 true，稳定后改 false。
  debug_aggregate: true
  # 这是「启动时默认勾选」的角度。面板只列 0~180 每 10 度一个，
  # 负数表示「负号开关默认勾上」——面板会把 |a| 勾到对应的格子上，
  # 然后把勾选值展开成 ±（-180 与 180 是同一次旋转，自动合并）。
  # 所以这一行 [-90,-60,-30,0,30,60,90,180] 展开后是 0/30/60/90/180 + 负号。
  angles: [-90, -60, -30, 0, 30, 60, 90, 180]
  drop_zero: true

preprocess:
  roi_size: 116
  scale: 1.0
  clahe_clip: 2.0
  clahe_grid: [8, 8]
  min_radius: 20
  max_radius: 200

# 输入源：这一段是「输入源面板」打开时各控件的**初始值**。
# 注意：界面上改了不会写回这个文件，它只决定启动时的默认状态。
source:
  type: "folder"          # folder / single / camera
  folder_path: ""
  camera_index: 0
  fps: 15
  # 上一帧**处理完之后**再等多久取下一帧（不是固定帧率）。
  # 每一帧都要识别、都要发信号，所以节奏由推理速度决定，这里是额外的间隔。
  poll_interval_ms: 300
  # 循环播放：默认 **false（不勾选）**。勾上才会放完一遍再从第一张开始，
  # 否则跑完一遍就停。
  loop: false

serial:
  baudrate: 115200
  last_port: "COM3"
  # 注意：没有「仅变化时发送」这个选项了。固件是「收到 '1' 吹一次、收到 '0'
  # 立刻关」，必须**每张图发一个字节**，否则连续两颗 NG 的第二颗不会吹。