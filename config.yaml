app:
  log_dir: "./logs"
  csv_output: "./logs/results.csv"
  save_csv: true

target:
  numbers: ["12", "19", "20", "25", "37", "41", "43"]
  valid_min: 1
  valid_max: 48

models:
  # 下拉框里的候选清单。前两个已离线可用（在 models/official_models/ 里）。
  # ⚠️ PP-OCRv5_server_rec **本地没有**，选中它会联网下载 —— 离线环境请勿选
  #    （用户 m03646：「最好是离线」）。要离线用它，先把该模型目录下载进
  #    models/official_models/ 再说。
  rec_options:
    - "PP-OCRv6_small_rec"
    - "PP-OCRv6_medium_rec"
    - "PP-OCRv5_server_rec"
  ori_options:
    - "PP-LCNet_x1_0_textline_ori"
  default_rec: "PP-OCRv6_small_rec"
  default_ori: "PP-LCNet_x1_0_textline_ori"

engine:
  # 推理设备：
  #   auto  = 有可用 CUDA 就用 gpu:0，否则 cpu（换机器不用改配置）
  #   gpu:0 = 强制显卡；gpu:1 同理
  #   cpu   = 强制 CPU
  # GPU 初始化失败（没装驱动/显存不足）时程序会自动退回 CPU 再试一次，
  # 状态栏会提示，不会直接崩掉。
  device: "auto"

recognizer:
  # 单个候选进入聚合池的门槛（只做准入，不做择优）
  conf_threshold: 0.5
  # 【已废弃】旧版 0° 早退阈值。新版按「数字聚合分」选结果，必须跑完所有
  # 角度才能投票，早退会丢票；这个值已不再被读取，留着只为兼容旧配置。
  early_exit_conf: 0.99
  # 打印每个数字的 聚合分/最高分/票数。调优阶段建议 true，稳定后改 false。
  debug_aggregate: true
  # 这是「启动时默认勾选」的角度。面板只列 0~180 每 10 度一个，
  # 负数表示「负号开关默认勾上」——面板会把 |a| 勾到对应的格子上，
  # 然后把勾选值展开成 ±（-180 与 180 是同一次旋转，自动合并）。
  # 所以这一行 [-90,-60,-30,0,30,60,90,180] 展开后是 0/30/60/90/180 + 负号。
  angles: [-90, -60, -30, 0, 30, 60, 90, 180]
  drop_zero: true

preprocess:
  roi_size: 116
  scale: 1.0
  clahe_clip: 2.0
  clahe_grid: [8, 8]
  min_radius: 20
  max_radius: 200

# 输入源：这一段是「输入源面板」打开时各控件的**初始值**。
# 注意：界面上改了不会写回这个文件，它只决定启动时的默认状态。
source:
  type: "camera"          # folder / single / camera

# 历史面板保留条数（默认 10）。**这个数字会从界面写回本文件** —— 改完重启仍在。
history:
  max_items: 10

# 摄像头模式：Basler acA1300-60gm（GigE）+ NPN 电眼硬件触发。
# 硬件与接线不在本程序范围内，这里只管「怎么把图取进来」。
camera:
  # 电眼接在相机的哪一路 I/O，以及哪个电平沿有效。
  # ⚠️ 这两个值必须按现场接线调：接反了要么一张不出，要么连续出图。
  trigger_line: "Line1"
  trigger_activation: "RisingEdge"   # RisingEdge / FallingEdge
  # 曝光时间（微秒）。太亮会糊、太暗识别不了，按现场光照和传送速度调。
  exposure_us: 2000
  # 单次取图的超时。产线没工件过来时超时是正常的，只写日志、不弹窗。
  timeout_ms: 1000
  # 磁盘上保留多少张。**这个数字会从界面写回本文件**。
  # 两个目录各自独立滚动：进第 N+1 张就删各自最旧的一张。
  max_saved_images: 10

storage:
  # 相机原图（未叠任何框/字）
  capture_raw_dir: "./logs/captures_raw"
  # 带框 + 数字 + 置信度的结果图
  capture_result_dir: "./logs/captures_result"

serial:
  baudrate: 115200
  last_port: "COM3"
  # 注意：没有「仅变化时发送」这个选项了。固件是「收到 '1' 吹一次、收到 '0'
  # 立刻关」，必须**每张图发一个字节**，否则连续两颗 NG 的第二颗不会吹。